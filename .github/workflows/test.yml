name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Offline tests
        run: ./test.sh
      - name: Release build
        run: ./build.sh
